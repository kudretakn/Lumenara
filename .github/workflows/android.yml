name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Build and run unit tests and lint
        run: ./gradlew test lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  device:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 55
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
          df -h /
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apks-raw
      - name: Collect APKs
        run: |
          mkdir -p apks
          find apks-raw -name '*.apk' -exec cp {} apks/ \;
          ls -l apks
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TV device tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: android-tv
          arch: x86_64
          profile: tv_1080p
          ram-size: 3072M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: '-no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          script: ./scripts/ci-device-tests.sh apks screens
      - name: Upload device test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-device-artifacts
          path: screens/
          if-no-files-found: ignore
