name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  WP10_NDK_VERSION: '28.2.13676358'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;${{ env.WP10_NDK_VERSION }}
      - name: Verify strict gate and packaging fixtures
        env:
          WP01_PWSH: pwsh
        run: |
          python3 -B -m unittest discover -s scripts/test-results -p 'Wp01*Test.py' -v
          python3 -B -m unittest discover -s app/src/test/python -p 'Wp*Test.py' -v
      - name: Build and run unit tests and lint
        run: ./gradlew test lintDebug :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace
      - name: Upload lint and test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/tests/**
          if-no-files-found: ignore
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/androidTest/debug/*.apk
          if-no-files-found: error

  optimized-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;${{ env.WP10_NDK_VERSION }}
      - name: Build optimized QA and unsigned release APKs
        run: ./gradlew -Pwp02.testBuildType=qa :app:assembleQa :app:assembleQaAndroidTest :app:assembleRelease --stacktrace
      - name: Verify native stripping and measure APKs
        run: |
          set -euo pipefail
          for variant in qa release; do
            apk="app/build/outputs/apk/$variant/app-$variant.apk"
            abis=(--require-abi x86 --require-abi x86_64)
            if [[ "$variant" == release ]]; then
              apk="app/build/outputs/apk/release/app-release-unsigned.apk"
              abis=(--require-abi armeabi-v7a --require-abi arm64-v8a)
            fi
            cap="${variant^}"
            python3 scripts/apk-size-report.py "$apk" --output "app/build/reports/wp10/$variant-size.json"
            python3 scripts/verify-native.py "$apk" --ndk "$ANDROID_HOME/ndk/$WP10_NDK_VERSION" \
              --merged-libs "app/build/intermediates/merged_native_libs/$variant/merge${cap}NativeLibs/out/lib" \
              "${abis[@]}" --output "app/build/reports/wp10/$variant-native.json"
            test -s "app/build/outputs/mapping/$variant/mapping.txt"
          done
      - name: Upload optimized mapping and size evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: optimized-build-evidence
          path: |
            app/build/outputs/mapping/qa/
            app/build/outputs/mapping/release/
            app/build/reports/wp10/
          if-no-files-found: error
      - name: Stage the exact optimized app and test APK pair
        run: |
          mkdir -p qa-apks
          cp app/build/outputs/apk/qa/app-qa.apk qa-apks/
          cp app/build/outputs/apk/androidTest/qa/app-qa-androidTest.apk qa-apks/
          cd qa-apks
          sha256sum app-qa.apk app-qa-androidTest.apk > qa-apks.sha256
      - name: Upload prebuilt QA APKs
        uses: actions/upload-artifact@v4
        with:
          name: qa-apk
          path: qa-apks/
          if-no-files-found: error

  debug-device:
    name: debug-device (API${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: build
    # Full API36 suite keeps its one 30-minute gate budget. Leave room for two
    # 15-minute boot attempts, setup and artifact collection on a bad runner.
    timeout-minutes: ${{ matrix.job_timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 36
            arch: x86_64
            ram: 3072M
            job_timeout: 75
            test_timeout: 1800
            classes: ''
          # Google's API28 TV image exists only as x86; KVM runs it on x86_64 hosts.
          # Focused existing tests: Room/Vault import + marks, DPAD, Media3 and VLC.
          - api: 28
            arch: x86
            ram: 2048M
            job_timeout: 50
            test_timeout: 600
            classes: 'dev.lumenara.tv.CatalogIntegrationTest#refreshRollbackMarksEncryptionAndEpg,dev.lumenara.tv.SettingsSetupJourneyTest,dev.lumenara.tv.PlaybackTest,dev.lumenara.tv.VlcTest'
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debug-apk
          path: apks-raw
      - name: Collect APKs
        run: |
          mkdir -p apks
          find apks-raw -name '*.apk' -exec cp {} apks/ \;
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android TV debug tests
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: ${{ matrix.ram }}
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: '-no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          script: ./scripts/ci-device-tests.sh apks screens --class '${{ matrix.classes }}' --total-timeout ${{ matrix.test_timeout }} --artifact-reserve 120
      - name: Retry once if the emulator never ran the tests
        id: retry
        if: steps.attempt1.outcome == 'failure' && hashFiles('screens/summary.txt') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: ${{ matrix.ram }}
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: '-no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          script: ./scripts/ci-device-tests.sh apks screens --class '${{ matrix.classes }}' --total-timeout ${{ matrix.test_timeout }} --artifact-reserve 120
      - name: Fail if tests failed
        if: always() && steps.attempt1.outcome != 'success' && steps.retry.outcome != 'success'
        run: |
          cat screens/summary.txt || true
          exit 1
      - name: Upload device test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-debug-api${{ matrix.api }}
          path: screens/
          if-no-files-found: error

  qa-smoke:
    name: qa-smoke (API${{ matrix.api }})
    runs-on: ubuntu-latest
    needs: optimized-build
    # Two boot attempts (30m), one 15m gate budget, setup and artifact upload.
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 28
            arch: x86
            ram: 2048M
          - api: 36
            arch: x86_64
            ram: 3072M
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /usr/local/lib/node_modules /opt/hostedtoolcache/CodeQL /usr/share/swift
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: qa-apk
          path: apks
      - name: Verify the prebuilt QA pair
        run: |
          cd apks
          sha256sum --check qa-apks.sha256
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run optimized smoke test
        id: attempt1
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: ${{ matrix.ram }}
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: '-no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          # Same API36 TV profile, RAM, rendering and animations as the old
          # connectedQaAndroidTest job. API28 adds x86/2GB without excluding checks.
          # No test retry/reinstall/clear-data cycle: this smoke owns persistent work.
          script: ./scripts/qa-smoke.sh apks screens
      - name: Retry once if the emulator never ran the tests
        id: retry
        if: steps.attempt1.outcome == 'failure' && hashFiles('screens/summary.txt') == ''
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: android-tv
          arch: ${{ matrix.arch }}
          profile: tv_1080p
          ram-size: ${{ matrix.ram }}
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: '-no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none'
          script: ./scripts/qa-smoke.sh apks screens
      - name: Fail if the smoke test failed
        if: always() && steps.attempt1.outcome != 'success' && steps.retry.outcome != 'success'
        run: |
          cat screens/summary.txt || true
          exit 1
      - name: Upload QA device artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-qa-api${{ matrix.api }}
          path: screens/
          if-no-files-found: error

  # Preserve the existing required check name; matrix jobs alone are insufficient.
  # WP01's release gate also requires this exact aggregate job and every CI job.
  device:
    if: always()
    needs: [build, optimized-build, debug-device, qa-smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require every build and device matrix result
        env:
          WP10_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/Wp10DeviceGate.py
