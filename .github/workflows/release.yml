name: Release

# Pushing a tag such as v0.3.0 builds, signs and publishes the APK to the public
# kudretakn/Lumenara-releases repository, where the in-app updater looks for new versions.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # SHA-256 of the personal release certificate (see CHANGELOG 0.1.0). Every release must match
  # it, otherwise Android refuses to update the installed app.
  EXPECTED_CERT_SHA256: 2a4804f05adc3206055fd91777c6cc7c370ee1b3a23c9822eda3156aac9a80eb
  RELEASES_REPO: kudretakn/Lumenara-releases

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0

      - name: Check that the tag matches versionName
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag" != "$name" ]; then
            echo "Tag v$tag does not match versionName $name"; exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.LUMENARA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMENARA_KEYSTORE_PASSWORD }}
          RELEASES_TOKEN: ${{ secrets.LUMENARA_RELEASES_TOKEN }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing LUMENARA_KEYSTORE_B64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing LUMENARA_KEYSTORE_PASSWORD"
          [ -n "$RELEASES_TOKEN" ] || missing="$missing LUMENARA_RELEASES_TOKEN"
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi

      - name: Build release APK
        run: ./gradlew test :app:assembleRelease --stacktrace

      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.LUMENARA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMENARA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMENARA_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          out="dist/Lumenara-$VERSION.apk"
          "$tools/apksigner" sign --v4-signing-enabled false \
            --ks "$keystore" --ks-type PKCS12 --ks-key-alias "${KEY_ALIAS:-streamora}" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$out" app/build/outputs/apk/release/app-release-unsigned.apk
          certs="$("$tools/apksigner" verify --verbose --print-certs "$out")"
          echo "$certs" | grep -E 'Verified using v2 scheme|Verified using v3 scheme|certificate SHA-256'
          actual="$(echo "$certs" | sed -n 's/.*certificate SHA-256 digest: \([0-9a-f]*\).*/\1/p' | head -1)"
          if [ "$actual" != "$EXPECTED_CERT_SHA256" ]; then
            echo "Release certificate $actual does not match the personal certificate $EXPECTED_CERT_SHA256"; exit 1
          fi
          sha256sum "$out" | tee dist/SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Lumenara $VERSION" > dist/notes.md
          cat dist/notes.md

      - name: Publish to Lumenara-releases
        env:
          GH_TOKEN: ${{ secrets.LUMENARA_RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" "dist/Lumenara-$VERSION.apk" \
            --repo "$RELEASES_REPO" --title "Lumenara $VERSION" --notes-file dist/notes.md --latest

      - name: Keep the signed APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: lumenara-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
