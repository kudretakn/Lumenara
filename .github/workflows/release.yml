name: Release

# Pushing a tag such as v0.3.0 builds, signs and publishes the APK to the public
# kudretakn/Lumenara-releases repository, where the in-app updater looks for new versions.
# Manual dispatch is for device A/B builds and never publishes.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  WP10_NDK_VERSION: '28.2.13676358'
  # The unchanged personal certificate pin lives in scripts/test-results/Wp01ReleaseGate.py.
  RELEASES_REPO: kudretakn/Lumenara-releases

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release provenance before accessing signing secrets
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]]
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          python3 scripts/test-results/Wp01ReleaseGate.py ci --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"

      - name: Verify WP01 gate fixtures
        env:
          WP01_PWSH: pwsh
        run: python3 -m unittest discover -s scripts/test-results -p 'Wp01*Test.py' -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools build-tools;36.0.0 ndk;${{ env.WP10_NDK_VERSION }}

      - name: Check that the tag matches versionName
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          name="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$tag" != "$name" ]; then
            echo "Tag v$tag does not match versionName $name"; exit 1
          fi
          echo "version=$name" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "short_sha=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - name: Check signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.LUMENARA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMENARA_KEYSTORE_PASSWORD }}
          RELEASES_TOKEN: ${{ github.event_name == 'push' && secrets.LUMENARA_RELEASES_TOKEN || '' }}
        run: |
          missing=""
          [ -n "$KEYSTORE_B64" ] || missing="$missing LUMENARA_KEYSTORE_B64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing LUMENARA_KEYSTORE_PASSWORD"
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            [ -n "$RELEASES_TOKEN" ] || missing="$missing LUMENARA_RELEASES_TOKEN"
          fi
          if [ -n "$missing" ]; then echo "Missing repository secrets:$missing"; exit 1; fi

      - name: Build standalone ARM APKs and the transition fallback
        env:
          OPENSUBTITLES_API_KEY: ${{ secrets.OPENSUBTITLES_API_KEY }}
          TMDB_READ_TOKEN: ${{ secrets.TMDB_READ_TOKEN }}
        run: ./gradlew -Pwp15.abiSplits=true test :app:assembleRelease --stacktrace

      - name: Verify release native stripping and record build evidence
        run: |
          set -euo pipefail
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*.apk)
          [[ "${#apks[@]}" -eq 3 ]] || { echo "Expected two ABI APKs and one universal fallback"; exit 1; }
          for abi in armeabi-v7a arm64-v8a universal; do
            apk="app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            abis=(--require-abi "$abi")
            if [[ "$abi" == universal ]]; then
              abis=(--require-abi armeabi-v7a --require-abi arm64-v8a)
            fi
            python3 scripts/apk-size-report.py "$apk" --output "app/build/reports/wp10/release-$abi-unsigned-size.json"
            # verify-native checks exact ABI equality, so a second payload fails publication.
            python3 scripts/verify-native.py "$apk" --ndk "$ANDROID_HOME/ndk/$WP10_NDK_VERSION" \
              --merged-libs app/build/intermediates/merged_native_libs/release/mergeReleaseNativeLibs/out/lib \
              "${abis[@]}" --output "app/build/reports/wp10/release-$abi-native.json"
          done
          test -s app/build/outputs/mapping/release/mapping.txt

      - name: Sign and verify
        env:
          KEYSTORE_B64: ${{ secrets.LUMENARA_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.LUMENARA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.LUMENARA_KEY_ALIAS }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.p12"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$keystore"
          tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p dist
          stem="Lumenara-$VERSION"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            stem="$stem-exp-${GITHUB_SHA:0:7}"
          fi
          version_code="$(sed -n 's/.*versionCode = \([0-9]*\).*/\1/p' app/build.gradle.kts)"
          test -n "$version_code"
          : > dist/SHA256SUMS.txt
          for abi in armeabi-v7a arm64-v8a universal; do
            out="dist/$stem-$abi.apk"
            "$tools/apksigner" sign --v4-signing-enabled false \
              --ks "$keystore" --ks-type PKCS12 --ks-key-alias "${KEY_ALIAS:-streamora}" \
              --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
              --out "$out" "app/build/outputs/apk/release/app-$abi-release-unsigned.apk"
            certs="$("$tools/apksigner" verify --verbose --print-certs "$out")"
            echo "$certs" | grep -E 'Verified using v2 scheme|Verified using v3 scheme|certificate SHA-256'
            printf '%s\n' "$certs" > "$RUNNER_TEMP/Wp01-certificate.txt"
            python3 scripts/test-results/Wp01ReleaseGate.py certificate "$RUNNER_TEMP/Wp01-certificate.txt"
            # All three must update the same installed package without ABI version-code offsets.
            package_line="$("$tools/aapt" dump badging "$out" | sed -n '1p')"
            [[ "$package_line" == "package: name='dev.lumenara.tv' versionCode='$version_code' versionName='$VERSION'"* ]]
            sha256sum "$out" | tee -a dist/SHA256SUMS.txt
          done

      - name: Measure the signed APK
        run: |
          set -euo pipefail
          for apk in dist/*.apk; do
            name="$(basename "$apk" .apk)"
            python3 scripts/apk-size-report.py "$apk" --output "app/build/reports/wp10/$name-signed-size.json"
          done

      - name: Keep release mapping and measured size/native reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-build-evidence
          path: |
            app/build/outputs/mapping/release/
            app/build/reports/wp10/
          if-no-files-found: error

      - name: Release notes from CHANGELOG
        if: github.event_name == 'push'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## " v) == 1 { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > dist/notes.md
          [ -s dist/notes.md ] || echo "Lumenara $VERSION" > dist/notes.md
          cat dist/notes.md

      - name: Publish to Lumenara-releases
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.LUMENARA_RELEASES_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SOURCE_GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Recheck immediately before publication: a cancelled/failed rerun blocks release.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          GH_TOKEN="$SOURCE_GH_TOKEN" python3 scripts/test-results/Wp01ReleaseGate.py ci --sha "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY"
          # The single *-universal.apk is required by the pre-WP15 API asset selector.
          gh release create "v$VERSION" \
            "dist/Lumenara-$VERSION-armeabi-v7a.apk" \
            "dist/Lumenara-$VERSION-arm64-v8a.apk" \
            "dist/Lumenara-$VERSION-universal.apk" \
            --repo "$RELEASES_REPO" --title "Lumenara $VERSION" --notes-file dist/notes.md --latest

      - name: Keep the signed APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'push' && 'lumenara-release' || format('lumenara-experiment-{0}', steps.version.outputs.short_sha) }}
          retention-days: ${{ github.event_name == 'workflow_dispatch' && 3 || 0 }}
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
